name: Apply Project bootstrap collision fix

on:
  push:
    branches:
      - fix/project-bootstrap-name-collision

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/project-bootstrap-name-collision
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Apply fix
        run: python scripts/_patch_project_bootstrap_collision.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/_patch_project_bootstrap_collision.py
          rm .github/workflows/apply-project-bootstrap-collision-fix.yml

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Format and validate
        run: |
          ruff format scripts/orchestrator/github.py tests/test_project_bootstrap.py
          ruff check --fix scripts/orchestrator/github.py tests/test_project_bootstrap.py
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Project bootstrap name collisions'
          git push origin HEAD:fix/project-bootstrap-name-collision
