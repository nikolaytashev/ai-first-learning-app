[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "yaml"]
ignore_missing_imports = true
