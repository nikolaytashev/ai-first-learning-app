name: Temporary P0 formatter

on:
  push:
    branches:
      - hardening/autonomous-runtime-p0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hardening/autonomous-runtime-p0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.22
      - run: ruff format scripts/orchestrator/safety_control.py tests/test_validation_hardening.py tests/test_runtime_hardening_contracts.py tests/test_process_lock.py scripts/orchestrator/process_lock.py scripts/orchestrator/validation.py scripts/run_orchestrator.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/orchestrator/safety_control.py tests/test_validation_hardening.py tests/test_runtime_hardening_contracts.py tests/test_process_lock.py scripts/orchestrator/process_lock.py scripts/orchestrator/validation.py scripts/run_orchestrator.py
          git commit -m 'Format P0 runtime hardening files'
          git push origin HEAD:hardening/autonomous-runtime-p0
