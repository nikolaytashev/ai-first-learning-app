name: Apply Codex structured output compatibility fix

on:
  push:
    branches:
      - fix/codex-structured-output-compatibility

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/codex-structured-output-compatibility
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production fix and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/orchestrator/codex.py')
          text = path.read_text()
          text = text.replace(
              'import time\nfrom collections.abc import Mapping\n',
              'import time\nfrom collections.abc import Mapping\nfrom tempfile import TemporaryDirectory\n',
              1,
          )

          anchor = '''def validate_output(output: JsonObject, schema_path: Path) -> None:\n'''
          helpers = '''_CODEX_OUTPUT_SCHEMA_KEYS = {\n    \"type\",\n    \"properties\",\n    \"required\",\n    \"additionalProperties\",\n    \"items\",\n    \"enum\",\n    \"anyOf\",\n    \"$defs\",\n    \"$ref\",\n    \"description\",\n}\n\n\ndef _project_codex_schema(value: Any) -> Any:\n    \"\"\"Project full JSON Schema into the conservative Structured Outputs subset.\"\"\"\n    if isinstance(value, list):\n        return [_project_codex_schema(item) for item in value]\n    if not isinstance(value, dict):\n        return value\n\n    projected: dict[str, Any] = {}\n    for key, item in value.items():\n        if key == \"const\":\n            projected[\"enum\"] = [item]\n            continue\n        if key == \"oneOf\":\n            if isinstance(item, list):\n                projected[\"anyOf\"] = [_project_codex_schema(entry) for entry in item]\n            continue\n        if key not in _CODEX_OUTPUT_SCHEMA_KEYS:\n            continue\n        if key in {\"properties\", \"$defs\"} and isinstance(item, dict):\n            projected[key] = {\n                str(name): _project_codex_schema(child) for name, child in item.items()\n            }\n        elif key in {\"items\", \"anyOf\"}:\n            projected[key] = _project_codex_schema(item)\n        elif key != \"additionalProperties\":\n            projected[key] = item\n\n    properties = projected.get(\"properties\")\n    schema_type = projected.get(\"type\")\n    object_type = schema_type == \"object\" or (\n        isinstance(schema_type, list) and \"object\" in schema_type\n    )\n    if object_type or isinstance(properties, dict):\n        projected[\"additionalProperties\"] = False\n        if isinstance(properties, dict):\n            projected[\"required\"] = list(properties)\n    return projected\n\n\ndef codex_output_schema(schema: JsonObject) -> JsonObject:\n    \"\"\"Return a Codex-compatible projection while preserving the full local contract.\"\"\"\n    projected = _project_codex_schema(schema)\n    if not isinstance(projected, dict):\n        raise ValueError(\"Codex output schema projection must be a JSON object\")\n    return cast(JsonObject, projected)\n\n\ndef _codex_failure_detail(\n    stdout: str,\n    stderr: str,\n    environment: Mapping[str, str],\n) -> str:\n    \"\"\"Extract useful JSONL error events plus stderr from a failed Codex process.\"\"\"\n    details: list[str] = []\n    for line in stdout.splitlines():\n        stripped = line.strip()\n        if not stripped:\n            continue\n        try:\n            event = json.loads(stripped)\n        except json.JSONDecodeError:\n            continue\n        if not isinstance(event, dict):\n            continue\n        event_type = event.get(\"type\")\n        if event_type == \"error\":\n            message = event.get(\"message\")\n            if message is not None:\n                details.append(str(message))\n        elif event_type == \"turn.failed\":\n            error = event.get(\"error\")\n            if isinstance(error, dict) and error.get(\"message\") is not None:\n                details.append(str(error[\"message\"]))\n            elif error is not None:\n                details.append(str(error))\n        elif event_type == \"item.completed\":\n            item = event.get(\"item\")\n            if isinstance(item, dict) and item.get(\"type\") == \"error\":\n                message = item.get(\"message\")\n                if message is not None:\n                    details.append(str(message))\n\n    if stderr.strip():\n        details.append(stderr.strip())\n    if not details and stdout.strip():\n        details.append(stdout.strip())\n    return _redact(\" | \".join(details), environment)[-2000:]\n\n\n'''
          if anchor not in text:
              raise SystemExit('validate_output anchor not found')
          text = text.replace(anchor, helpers + anchor, 1)

          old_run = '''        command = [\n            self._executable,\n            \"exec\",\n            \"--json\",\n            \"--ephemeral\",\n            \"--sandbox\",\n            self._sandbox,\n            \"--cd\",\n            str(self._root),\n            \"--model\",\n            model.model,\n            \"--config\",\n            f'model_reasoning_effort=\"{model.reasoning_effort}\"',\n            \"--config\",\n            f'web_search=\"{self._web_search}\"',\n            \"--output-schema\",\n            str(schema_path),\n            \"-\",\n        ]\n        started = time.monotonic()\n        try:\n            completed = subprocess.run(\n                command,\n                input=prompt,\n                text=True,\n                capture_output=True,\n                check=False,\n                timeout=timeout_seconds,\n                cwd=self._root,\n                env=sanitized_agent_environment(self._environment),\n            )\n        except subprocess.TimeoutExpired as exc:\n            raise RuntimeError(\"Codex role run exceeded its elapsed-time budget\") from exc\n'''
          new_run = '''        source_schema = _load_schema(schema_path)\n        projected_schema = codex_output_schema(source_schema)\n        started = time.monotonic()\n        try:\n            with TemporaryDirectory(prefix=\"codex-output-schema-\") as temporary_directory:\n                codex_schema_path = Path(temporary_directory) / schema_path.name\n                codex_schema_path.write_text(\n                    json.dumps(projected_schema, ensure_ascii=False, indent=2),\n                    encoding=\"utf-8\",\n                )\n                command = [\n                    self._executable,\n                    \"exec\",\n                    \"--json\",\n                    \"--ephemeral\",\n                    \"--sandbox\",\n                    self._sandbox,\n                    \"--cd\",\n                    str(self._root),\n                    \"--model\",\n                    model.model,\n                    \"--config\",\n                    f'model_reasoning_effort=\"{model.reasoning_effort}\"',\n                    \"--config\",\n                    f'web_search=\"{self._web_search}\"',\n                    \"--output-schema\",\n                    str(codex_schema_path),\n                    \"-\",\n                ]\n                completed = subprocess.run(\n                    command,\n                    input=prompt,\n                    text=True,\n                    capture_output=True,\n                    check=False,\n                    timeout=timeout_seconds,\n                    cwd=self._root,\n                    env=sanitized_agent_environment(self._environment),\n                )\n        except subprocess.TimeoutExpired as exc:\n            raise RuntimeError(\"Codex role run exceeded its elapsed-time budget\") from exc\n'''
          if old_run not in text:
              raise SystemExit('Codex command block not found')
          text = text.replace(old_run, new_run, 1)

          old_failure = '''        if completed.returncode != 0:\n            detail = _redact(completed.stderr.strip(), self._environment)[-1000:]\n            suffix = f\": {detail}\" if detail else \"\"\n            raise RuntimeError(f\"Codex CLI failed with exit code {completed.returncode}{suffix}\")\n'''
          new_failure = '''        if completed.returncode != 0:\n            detail = _codex_failure_detail(\n                completed.stdout,\n                completed.stderr,\n                self._environment,\n            )\n            suffix = f\": {detail}\" if detail else \"\"\n            raise RuntimeError(f\"Codex CLI failed with exit code {completed.returncode}{suffix}\")\n'''
          if old_failure not in text:
              raise SystemExit('Codex failure block not found')
          text = text.replace(old_failure, new_failure, 1)
          path.write_text(text)

          tests = Path('tests/test_codex.py')
          tests.write_text('''\"\"\"Tests for Codex structured-output compatibility and diagnostics.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\nfrom typing import Any, cast\n\nfrom scripts.orchestrator.codex import _codex_failure_detail, codex_output_schema\nfrom scripts.orchestrator.model import JsonObject\nfrom scripts.validate_repository import ROOT\n\n_FORBIDDEN_CODEX_KEYS = {\n    \"$schema\",\n    \"$id\",\n    \"title\",\n    \"const\",\n    \"oneOf\",\n    \"allOf\",\n    \"not\",\n    \"if\",\n    \"then\",\n    \"else\",\n    \"dependentRequired\",\n    \"dependentSchemas\",\n    \"uniqueItems\",\n    \"minLength\",\n    \"maxLength\",\n    \"pattern\",\n    \"format\",\n    \"minimum\",\n    \"maximum\",\n    \"exclusiveMinimum\",\n    \"exclusiveMaximum\",\n    \"multipleOf\",\n    \"minItems\",\n    \"maxItems\",\n}\n\n\ndef _load(path: Path) -> JsonObject:\n    raw = json.loads(path.read_text(encoding=\"utf-8\"))\n    assert isinstance(raw, dict)\n    return cast(JsonObject, raw)\n\n\ndef _assert_codex_subset(value: Any) -> None:\n    if isinstance(value, list):\n        for item in value:\n            _assert_codex_subset(item)\n        return\n    if not isinstance(value, dict):\n        return\n    assert not (_FORBIDDEN_CODEX_KEYS & set(value))\n    properties = value.get(\"properties\")\n    schema_type = value.get(\"type\")\n    is_object = schema_type == \"object\" or (\n        isinstance(schema_type, list) and \"object\" in schema_type\n    )\n    if is_object or isinstance(properties, dict):\n        assert value.get(\"additionalProperties\") is False\n        if isinstance(properties, dict):\n            assert set(value.get(\"required\", [])) == set(properties)\n    for child in value.values():\n        _assert_codex_subset(child)\n\n\ndef test_all_agent_schemas_project_to_conservative_codex_subset() -> None:\n    schema_paths = sorted((ROOT / \"schemas\").glob(\"*.schema.json\"))\n    assert schema_paths\n    for schema_path in schema_paths:\n        projected = codex_output_schema(_load(schema_path))\n        _assert_codex_subset(projected)\n\n\ndef test_projection_converts_const_and_preserves_full_schema_on_disk() -> None:\n    schema_path = ROOT / \"schemas\" / \"feature-proposal.schema.json\"\n    original = _load(schema_path)\n    projected = codex_output_schema(original)\n\n    assert projected[\"properties\"][\"schema_version\"] == {\"enum\": [1]}\n    assert \"allOf\" in original\n    assert \"allOf\" not in projected\n\n\ndef test_failed_codex_jsonl_diagnostics_include_stdout_and_redact_secrets() -> None:\n    stdout = (\n        '{\"type\":\"item.completed\",\"item\":{'\n        '\"type\":\"error\",\"message\":\"Invalid output schema token-secret\"}}\\n'\n        '{\"type\":\"turn.failed\",\"error\":{'\n        '\"message\":\"request rejected\"}}\\n'\n    )\n    detail = _codex_failure_detail(\n        stdout,\n        \"backend failed\",\n        {\"GITHUB_TOKEN\": \"token-secret\"},\n    )\n\n    assert \"Invalid output schema [REDACTED]\" in detail\n    assert \"request rejected\" in detail\n    assert \"backend failed\" in detail\n    assert \"token-secret\" not in detail\n''')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-codex-structured-output-fix.yml
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Format production changes
        run: |
          ruff check --fix scripts/orchestrator/codex.py tests/test_codex.py
          ruff format scripts/orchestrator/codex.py tests/test_codex.py
      - name: Validate
        run: |
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/orchestrator/codex.py tests/test_codex.py .github/workflows/apply-codex-structured-output-fix.yml
          git commit -m 'Make Codex output schemas strict-compatible'
          git push origin HEAD:fix/codex-structured-output-compatibility
