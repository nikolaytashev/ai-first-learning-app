name: Fix sub-issue reprioritize

on:
  push:
    branches:
      - fix/sub-issue-first-position-reprioritize

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/sub-issue-first-position-reprioritize
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Patch first-position reprioritization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/orchestrator/github.py')
          text = path.read_text()
          old = '''        payload: JsonObject = {"sub_issue_id": child_database_id}\n        if after_database_id is not None:\n            payload["after_id"] = after_database_id\n        else:\n            payload["after_id"] = None\n        self._rest(\n'''
          new = '''        payload: JsonObject = {"sub_issue_id": child_database_id}\n        if after_database_id is not None:\n            payload["after_id"] = after_database_id\n        else:\n            siblings = self.list_sub_issues(parent_issue_number)\n            if not siblings or siblings[0].id == child_database_id:\n                return\n            payload["before_id"] = siblings[0].id\n        self._rest(\n'''
          if old not in text:
              raise SystemExit('expected reprioritize block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > tests/test_github_sub_issues.py <<'PY'
          """Regression tests for native GitHub sub-issue ordering."""

          from __future__ import annotations

          from pathlib import Path
          from typing import Any

          from scripts.orchestrator.config import load_config
          from scripts.orchestrator.github import GitHubClient
          from scripts.orchestrator.model import IssueSnapshot, JsonObject

          ROOT = Path(__file__).resolve().parents[1]


          def _issue(database_id: int, number: int) -> IssueSnapshot:
              return IssueSnapshot(
                  id=database_id,
                  number=number,
                  node_id=f"node-{number}",
                  url=f"https://github.com/example/repo/issues/{number}",
                  title=f"Issue {number}",
                  body="",
                  state="open",
                  state_reason=None,
                  author="bot",
                  labels=(),
              )


          class FakeSubIssueClient(GitHubClient):
              def __init__(self, siblings: list[IssueSnapshot]) -> None:
                  self._config = load_config(ROOT, environment={})
                  self._siblings = siblings
                  self.calls: list[tuple[str, str, JsonObject | None]] = []

              def list_sub_issues(self, issue_number: int) -> list[IssueSnapshot]:
                  assert issue_number == 21
                  return self._siblings

              def _rest(
                  self, method: str, path: str, payload: JsonObject | None = None
              ) -> Any:
                  self.calls.append((method, path, payload))
                  return {}


          def test_reprioritize_first_child_is_noop_when_already_first() -> None:
              child = _issue(101, 23)
              client = FakeSubIssueClient([child, _issue(102, 24)])

              client.reprioritize_sub_issue(21, child.id)

              assert client.calls == []


          def test_reprioritize_only_child_is_noop() -> None:
              child = _issue(101, 23)
              client = FakeSubIssueClient([child])

              client.reprioritize_sub_issue(21, child.id)

              assert client.calls == []


          def test_reprioritize_to_first_uses_before_id_not_null_after_id() -> None:
              first = _issue(101, 23)
              child = _issue(102, 24)
              client = FakeSubIssueClient([first, child])

              client.reprioritize_sub_issue(21, child.id)

              assert client.calls == [
                  (
                      "PATCH",
                      "/repos/nikolaytashev/ai-first-learning-app/issues/21/sub_issues/priority",
                      {"sub_issue_id": child.id, "before_id": first.id},
                  )
              ]


          def test_reprioritize_after_sibling_uses_after_id() -> None:
              first = _issue(101, 23)
              child = _issue(102, 24)
              client = FakeSubIssueClient([first, child])

              client.reprioritize_sub_issue(21, child.id, after_database_id=first.id)

              assert client.calls == [
                  (
                      "PATCH",
                      "/repos/nikolaytashev/ai-first-learning-app/issues/21/sub_issues/priority",
                      {"sub_issue_id": child.id, "after_id": first.id},
                  )
              ]
          PY
      - name: Validate repository
        run: |
          python scripts/validate_repository.py
          ruff format .
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          detect-secrets scan --all-files --baseline .secrets.baseline
      - name: Commit fix
        run: |
          git config user.name "Nikolay Tashev"
          git config user.email "43911488+nikolaytashev@users.noreply.github.com"
          git add scripts/orchestrator/github.py tests/test_github_sub_issues.py
          git commit -m "Fix first-position sub-issue reprioritization"
          git push origin HEAD:fix/sub-issue-first-position-reprioritize
