schema_version: 2

repository:
  owner: nikolaytashev
  name: ai-first-learning-app
  default_branch: main
  visibility: public

project:
  owner: nikolaytashev
  number: 1
  url: https://github.com/users/nikolaytashev/projects/1
  configuration_status: configured
  required_fields:
    Status:
      type: single_select
      options: [Inbox, Ready, In Progress, In Review, Awaiting Human, Blocked, Done, Cancelled]
    Product Approval:
      type: single_select
      options: [Pending, Approved, Changes Requested, Rejected]
    Type:
      type: single_select
      options: [Epic, Feature, Task, Bug, Decision, Architecture]
    Origin:
      type: single_select
      options: [Human, Agent]
    Priority:
      type: single_select
      options: [P0, P1, P2, P3]
    Size:
      type: single_select
      options: [XS, S, M, L]
    Current Role:
      type: single_select
      options: [PM, BA, Architect, Instructional Designer, Implementer, QA, Reviewer, Human]
    Automation State:
      type: single_select
      options: [Queued, Running, Waiting, Failed, Completed]
    Attempt Count:
      type: number
    Workflow ID:
      type: text
    Blocked Reason:
      type: text

authorization:
  human_approvers:
    - nikolaytashev
  automation_login: null
  automation_identity_type: github_app
  automation_identity_status: provisioning_required
  command_prefix: /orch
  accepted_commands:
    - analyze
    - replan
    - approve
    - pause
    - resume
    - cancel
    - priority
    - rework

branch_policy:
  protected_branches:
    - main
  automation_branch_prefix: agent/
  direct_push_to_default: forbidden
  force_push: forbidden
  deletion: forbidden
  pull_request_required: true
  required_conversation_resolution: true
  required_status_checks:
    - repository-validation
  apply_to_administrators: true
  # Human-verified on 2026-09-09 with bypass_actors=[] and current_user_can_bypass=never.
  # The App only needs Metadata read; any ruleset mutation changes updated_at and fails doctor.
  verified_ruleset_id: 22659425
  verified_ruleset_updated_at: "2026-09-09T19:20:05.183+03:00"

automation_permissions:
  allowed:
    - read_repository
    - read_repository_rules
    - read_and_write_issues
    - read_issue_comments
    - read_and_write_project_items
    - create_issue_comments
    - manage_sub_issues
    - manage_issue_dependencies
    - create_namespaced_branches
    - push_namespaced_branches
    - create_draft_pull_requests
    - close_own_draft_pull_requests
  forbidden:
    - push_default_branch
    - merge_pull_requests
    - create_releases
    - deploy
    - manage_secrets
    - manage_rulesets
    - manage_collaborators
    - change_visibility

bootstrap_blockers:
  - Provision the repository-scoped GitHub App and configure its Client ID and private key path outside the repository.
