name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Lint Python
        run: ruff check .

      - name: Show Python formatting diff
        run: ruff format --diff .

      - name: Check Python types
        run: mypy scripts tests

      - name: Run tests
        run: pytest

      - name: Scan for unreviewed secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline
