name: Format diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - name: Apply Ruff formatting and remove diagnostic workflow
        run: |
          ruff format .
          rm .github/workflows/format-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/orchestrator/notifications.py scripts/orchestrator/repository_health.py scripts/run_orchestrator.py tests/test_runtime_policy.py .github/workflows/format-diagnostic.yml
          git commit -m "Format autonomous runtime policy code"
          git push origin HEAD:${{ github.head_ref }}
