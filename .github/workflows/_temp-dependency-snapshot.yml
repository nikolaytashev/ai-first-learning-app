name: Temporary dependency snapshot patch

on:
  push:
    branches:
      - autonomy/runtime-completion
    paths:
      - scripts/_temp_dependency_snapshot_patch.py
      - scripts/_temp_dependency_snapshot_fix.py
      - .github/workflows/_temp-dependency-snapshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: autonomy/runtime-completion
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - name: Apply patch
        run: |
          python scripts/_temp_dependency_snapshot_fix.py
          python scripts/_temp_dependency_snapshot_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_runtime_completion_contracts.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "_validate_current_application_state" in implementation\n'
          if old not in text:
              raise SystemExit("stale application-state contract assertion not found")
          text = text.replace(old, '    assert "_sync_uncommitted_work_with_main" in implementation\n', 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format
        run: ruff format scripts tests
      - name: Remove temporary files
        run: rm scripts/_temp_dependency_snapshot_patch.py scripts/_temp_dependency_snapshot_fix.py .github/workflows/_temp-dependency-snapshot.yml
      - name: Validate
        run: |
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add dependency-aware replanning and current app snapshots"
          git push origin HEAD:autonomy/runtime-completion
