name: Apply proposal platform and telemetry fix

on:
  push:
    branches:
      - fix/proposal-platform-context-and-attempt-telemetry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/proposal-platform-context-and-attempt-telemetry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Apply fix and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/project-context/context-index.yaml',
              '    consumers: [architect, implementer, qa, reviewer]\n    task_types: [architecture, planning, implementation, review]\n',
              '    consumers: [product_manager, business_analysis, architect, implementer, qa, reviewer]\n'
              '    task_types: [proposal_generation, acceptance_criteria, architecture, planning, implementation, review]\n',
          )

          replace_once(
              'scripts/orchestrator/codex.py',
              'class AgentRunner(Protocol):\n'
              '    """Role execution boundary used by the deterministic orchestrator."""\n\n'
              '    def run(\n'
              '        self,\n'
              '        *,\n'
              '        prompt: str,\n'
              '        schema_path: Path,\n'
              '        model: ModelSelection,\n'
              '        timeout_seconds: int,\n'
              '    ) -> CodexRun:\n'
              '        """Execute one role action and return schema-valid structured output."""\n'
              '        ...\n\n\n',
              'class AgentRunner(Protocol):\n'
              '    """Role execution boundary used by the deterministic orchestrator."""\n\n'
              '    def run(\n'
              '        self,\n'
              '        *,\n'
              '        prompt: str,\n'
              '        schema_path: Path,\n'
              '        model: ModelSelection,\n'
              '        timeout_seconds: int,\n'
              '    ) -> CodexRun:\n'
              '        """Execute one role action and return schema-valid structured output."""\n'
              '        ...\n\n\n'
              'class CodexInvocationError(RuntimeError):\n'
              '    """Codex failure carrying any telemetry observed before the failure."""\n\n'
              '    def __init__(\n'
              '        self,\n'
              '        message: str,\n'
              '        *,\n'
              '        usage: Usage | None,\n'
              '        elapsed_ms: int,\n'
              '        thread_id: str | None,\n'
              '    ) -> None:\n'
              '        super().__init__(message)\n'
              '        self.usage = usage\n'
              '        self.elapsed_ms = elapsed_ms\n'
              '        self.thread_id = thread_id\n\n\n',
          )

          replace_once(
              'scripts/orchestrator/codex.py',
              'def validate_output(output: JsonObject, schema_path: Path) -> None:\n',
              'def _jsonl_telemetry(stdout: str) -> tuple[Usage | None, str | None]:\n'
              '    """Recover thread and completed-turn usage from a JSONL stream when present."""\n'
              '    usage: Usage | None = None\n'
              '    thread_id: str | None = None\n'
              '    for line in stdout.splitlines():\n'
              '        try:\n'
              '            event = json.loads(line)\n'
              '        except (json.JSONDecodeError, TypeError):\n'
              '            continue\n'
              '        if not isinstance(event, dict):\n'
              '            continue\n'
              '        if event.get("type") == "thread.started" and isinstance(event.get("thread_id"), str):\n'
              '            thread_id = cast(str, event["thread_id"])\n'
              '        if event.get("type") != "turn.completed":\n'
              '            continue\n'
              '        raw = event.get("usage")\n'
              '        if not isinstance(raw, dict):\n'
              '            continue\n'
              '        input_tokens = raw.get("input_tokens")\n'
              '        output_tokens = raw.get("output_tokens")\n'
              '        if (\n'
              '            isinstance(input_tokens, int)\n'
              '            and not isinstance(input_tokens, bool)\n'
              '            and input_tokens >= 0\n'
              '            and isinstance(output_tokens, int)\n'
              '            and not isinstance(output_tokens, bool)\n'
              '            and output_tokens >= 0\n'
              '        ):\n'
              '            usage = Usage(\n'
              '                input_tokens=input_tokens,\n'
              '                output_tokens=output_tokens,\n'
              '                total_tokens=input_tokens + output_tokens,\n'
              '            )\n'
              '    return usage, thread_id\n\n\n'
              'def validate_output(output: JsonObject, schema_path: Path) -> None:\n',
          )

          replace_once(
              'scripts/orchestrator/codex.py',
              '        except subprocess.TimeoutExpired as exc:\n'
              '            raise RuntimeError("Codex role run exceeded its elapsed-time budget") from exc\n'
              '        elapsed_ms = int((time.monotonic() - started) * 1000)\n\n'
              '        if completed.returncode != 0:\n'
              '            detail = _codex_failure_detail(\n'
              '                completed.stdout,\n'
              '                completed.stderr,\n'
              '                self._environment,\n'
              '            )\n'
              '            suffix = f": {detail}" if detail else ""\n'
              '            raise RuntimeError(f"Codex CLI failed with exit code {completed.returncode}{suffix}")\n',
              '        except subprocess.TimeoutExpired as exc:\n'
              '            elapsed_ms = int((time.monotonic() - started) * 1000)\n'
              '            raw_stdout = exc.stdout or ""\n'
              '            stdout = (\n'
              '                raw_stdout.decode("utf-8", errors="replace")\n'
              '                if isinstance(raw_stdout, bytes)\n'
              '                else raw_stdout\n'
              '            )\n'
              '            usage, thread_id = _jsonl_telemetry(stdout)\n'
              '            raise CodexInvocationError(\n'
              '                "Codex role run exceeded its elapsed-time budget",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            ) from exc\n'
              '        elapsed_ms = int((time.monotonic() - started) * 1000)\n\n'
              '        if completed.returncode != 0:\n'
              '            detail = _codex_failure_detail(\n'
              '                completed.stdout,\n'
              '                completed.stderr,\n'
              '                self._environment,\n'
              '            )\n'
              '            suffix = f": {detail}" if detail else ""\n'
              '            usage, thread_id = _jsonl_telemetry(completed.stdout)\n'
              '            raise CodexInvocationError(\n'
              '                f"Codex CLI failed with exit code {completed.returncode}{suffix}",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            )\n',
          )

          replace_once(
              'scripts/orchestrator/codex.py',
              '        if fatal_error is not None:\n'
              '            raise RuntimeError(_redact(fatal_error, self._environment)[-1000:])\n'
              '        if not turn_completed:\n'
              '            raise RuntimeError("Codex CLI exited without a turn.completed event")\n'
              '        if output is None:\n'
              '            raise RuntimeError("Codex CLI completed without a structured agent message")\n'
              '        if usage is None:\n'
              '            raise RuntimeError("Codex CLI completed without measured token usage")\n',
              '        if fatal_error is not None:\n'
              '            raise CodexInvocationError(\n'
              '                _redact(fatal_error, self._environment)[-1000:],\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            )\n'
              '        if not turn_completed:\n'
              '            raise CodexInvocationError(\n'
              '                "Codex CLI exited without a turn.completed event",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            )\n'
              '        if output is None:\n'
              '            raise CodexInvocationError(\n'
              '                "Codex CLI completed without a structured agent message",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            )\n'
              '        if usage is None:\n'
              '            raise CodexInvocationError(\n'
              '                "Codex CLI completed without measured token usage",\n'
              '                usage=None,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            )\n',
          )

          replace_once(
              'scripts/orchestrator/codex.py',
              '        except ValidationError as exc:\n'
              '            raise RuntimeError(\n'
              '                f"Codex structured output failed schema validation: {exc.message}"\n'
              '            ) from exc\n',
              '        except ValidationError as exc:\n'
              '            raise CodexInvocationError(\n'
              '                f"Codex structured output failed schema validation: {exc.message}",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            ) from exc\n',
          )

          replace_once(
              'scripts/orchestrator/state.py',
              'from scripts.orchestrator.model import CodexRun, JsonObject, ModelSelection\n',
              'from scripts.orchestrator.model import CodexRun, JsonObject, ModelSelection, Usage\n',
          )
          replace_once(
              'scripts/orchestrator/state.py',
              '                    output_json TEXT NOT NULL,\n'
              '                    PRIMARY KEY (workflow_id, role, attempt)\n',
              '                    output_json TEXT NOT NULL,\n'
              '                    status TEXT NOT NULL DEFAULT \'success\',\n'
              '                    error TEXT,\n'
              '                    PRIMARY KEY (workflow_id, role, attempt)\n',
          )
          replace_once(
              'scripts/orchestrator/state.py',
              '                """\n'
              '            )\n\n'
              '    def create_workflow(self, workflow_id: str, proposal_id: str) -> None:\n',
              '                """\n'
              '            )\n'
              '            columns = {\n'
              '                str(row["name"]) for row in connection.execute("PRAGMA table_info(role_runs)")\n'
              '            }\n'
              '            if "status" not in columns:\n'
              '                connection.execute(\n'
              '                    "ALTER TABLE role_runs ADD COLUMN status TEXT NOT NULL DEFAULT \'success\'"\n'
              '                )\n'
              '            if "error" not in columns:\n'
              '                connection.execute("ALTER TABLE role_runs ADD COLUMN error TEXT")\n\n'
              '    def create_workflow(self, workflow_id: str, proposal_id: str) -> None:\n',
          )
          replace_once(
              'scripts/orchestrator/state.py',
              '    def save_proposal(self, workflow_id: str, proposal: JsonObject) -> None:\n',
              '    def record_role_failure(\n'
              '        self,\n'
              '        *,\n'
              '        workflow_id: str,\n'
              '        role: str,\n'
              '        attempt: int,\n'
              '        model: ModelSelection,\n'
              '        usage: Usage | None,\n'
              '        elapsed_ms: int,\n'
              '        error: str,\n'
              '    ) -> None:\n'
              '        """Persist a failed provider attempt and any measurable token usage."""\n'
              '        input_tokens = 0 if usage is None else usage.input_tokens\n'
              '        output_tokens = 0 if usage is None else usage.output_tokens\n'
              '        total_tokens = 0 if usage is None else usage.total_tokens\n'
              '        with self._connect() as connection:\n'
              '            connection.execute(\n'
              '                """\n'
              '                INSERT INTO role_runs (\n'
              '                    workflow_id, role, attempt, profile, model, reasoning_effort,\n'
              '                    input_tokens, output_tokens, total_tokens, elapsed_ms, output_json,\n'
              '                    status, error\n'
              '                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, \'{}\', \'failed\', ?)\n'
              '                """,\n'
              '                (\n'
              '                    workflow_id,\n'
              '                    role,\n'
              '                    attempt,\n'
              '                    model.profile,\n'
              '                    model.model,\n'
              '                    model.reasoning_effort,\n'
              '                    input_tokens,\n'
              '                    output_tokens,\n'
              '                    total_tokens,\n'
              '                    elapsed_ms,\n'
              '                    error[-2000:],\n'
              '                ),\n'
              '            )\n'
              '            connection.execute(\n'
              '                """\n'
              '                UPDATE workflows\n'
              '                SET input_tokens = input_tokens + ?,\n'
              '                    output_tokens = output_tokens + ?,\n'
              '                    total_tokens = total_tokens + ?,\n'
              '                    elapsed_ms = elapsed_ms + ?,\n'
              '                    updated_at = CURRENT_TIMESTAMP\n'
              '                WHERE workflow_id = ?\n'
              '                """,\n'
              '                (input_tokens, output_tokens, total_tokens, elapsed_ms, workflow_id),\n'
              '            )\n\n'
              '    def save_proposal(self, workflow_id: str, proposal: JsonObject) -> None:\n',
          )

          replace_once(
              'scripts/orchestrator/proposal.py',
              'from scripts.orchestrator.codex import AgentRunner\n',
              'from scripts.orchestrator.codex import AgentRunner, CodexInvocationError\n',
          )
          replace_once(
              'scripts/orchestrator/proposal.py',
              '_INLINE_POLICY_PATHS = frozenset({"docs/product/human-decisions.md"})\n\n\n',
              '_INLINE_POLICY_PATHS = frozenset({"docs/product/human-decisions.md"})\n\n\n'
              'def _is_gate_only_decision(value: str) -> bool:\n'
              '    """Identify approval mechanics already represented by first-class workflow fields."""\n'
              '    text = " ".join(value.casefold().split())\n'
              '    scope_gate = "approval" in text and "product scope" in text and "proposal" in text\n'
              '    priority_gate = (\n'
              '        "priority" in text\n'
              '        and ("approve" in text or "approval" in text or "override" in text)\n'
              '        and ("proposal" in text or "proposed" in text)\n'
              '    )\n'
              '    return scope_gate or priority_gate\n\n\n'
              'def _without_gate_only_decisions(proposal: JsonObject) -> JsonObject:\n'
              '    """Keep domain decisions separate from the standard Product Approval gate."""\n'
              '    normalized = dict(proposal)\n'
              '    decisions = normalized.get("decisions_required")\n'
              '    if isinstance(decisions, list):\n'
              '        normalized["decisions_required"] = [\n'
              '            str(item) for item in decisions if not _is_gate_only_decision(str(item))\n'
              '        ]\n'
              '    return normalized\n\n\n',
          )
          replace_once(
              'scripts/orchestrator/proposal.py',
              'Do not claim verification against an "approved specification", matrix, policy, or similar artifact\n'
              'unless it exists in canonical context; otherwise name the missing human decision explicitly.\n'
              'Repository-policy entries marked `reference_only` remain binding and may be read from their paths\n',
              'Do not claim verification against an "approved specification", matrix, policy, or similar artifact\n'
              'unless it exists in canonical context; otherwise name the missing human decision explicitly.\n'
              'Acceptance criteria must use the canonical client/platform from architecture context. Do not invent\n'
              'browser, CSS, DOM, or web-test requirements when the scoped client is the Flutter mobile app.\n'
              'The standard Product Approval gate and priority override are workflow mechanics, not domain\n'
              'decisions; never add them to `decisions_required`.\n'
              'Repository-policy entries marked `reference_only` remain binding and may be read from their paths\n',
          )
          replace_once(
              'scripts/orchestrator/proposal.py',
              '        provenance = output.get("provenance")\n'
              '        if (\n'
              '            output.get("proposal_id") != proposal_id\n',
              '        output = _without_gate_only_decisions(output)\n'
              '        provenance = output.get("provenance")\n'
              '        if (\n'
              '            output.get("proposal_id") != proposal_id\n',
          )
          replace_once(
              'scripts/orchestrator/proposal.py',
              'consent model, persistence model, or similar prerequisite, mark it `not_testable` and require the\n'
              'proposal to identify that prerequisite explicitly or narrow the criterion. Missing decisions that\n'
              'materially change user flow, persistence, privacy, security, or measurement must be surfaced.\n'
              'Repository-policy entries marked `reference_only` remain binding and may be read from their paths\n',
              'consent model, persistence model, or similar prerequisite, mark it `not_testable` and require the\n'
              'proposal to identify that prerequisite explicitly or narrow the criterion. Missing decisions that\n'
              'materially change user flow, persistence, privacy, security, or measurement must be surfaced.\n'
              'Reject acceptance criteria whose verification technology contradicts canonical architecture\n'
              'constraints (for example browser/CSS/DOM checks for a Flutter-only mobile flow). The standard\n'
              'Product Approval gate and priority override must not appear in `decisions_required`.\n'
              'Repository-policy entries marked `reference_only` remain binding and may be read from their paths\n',
          )
          replace_once(
              'scripts/orchestrator/proposal.py',
              '        for attempt in range(1, self._config.runtime.max_role_attempts + 1):\n'
              '            remaining = self._remaining_seconds(started)\n'
              '            model = select_model(self._config, role, action, attempt)\n'
              '            try:\n'
              '                run = self._agent.run(\n',
              '        for attempt in range(1, self._config.runtime.max_role_attempts + 1):\n'
              '            remaining = self._remaining_seconds(started)\n'
              '            model = select_model(self._config, role, action, attempt)\n'
              '            attempt_started = time.monotonic()\n'
              '            try:\n'
              '                run = self._agent.run(\n',
          )
          replace_once(
              'scripts/orchestrator/proposal.py',
              '            except RuntimeError as exc:\n'
              '                last_error = exc\n'
              '                if attempt == self._config.runtime.max_role_attempts:\n'
              '                    break\n',
              '            except CodexInvocationError as exc:\n'
              '                self._state.record_role_failure(\n'
              '                    workflow_id=workflow_id,\n'
              '                    role=state_role,\n'
              '                    attempt=attempt,\n'
              '                    model=model,\n'
              '                    usage=exc.usage,\n'
              '                    elapsed_ms=exc.elapsed_ms,\n'
              '                    error=str(exc),\n'
              '                )\n'
              '                last_error = exc\n'
              '                if attempt == self._config.runtime.max_role_attempts:\n'
              '                    break\n'
              '            except RuntimeError as exc:\n'
              '                self._state.record_role_failure(\n'
              '                    workflow_id=workflow_id,\n'
              '                    role=state_role,\n'
              '                    attempt=attempt,\n'
              '                    model=model,\n'
              '                    usage=None,\n'
              '                    elapsed_ms=int((time.monotonic() - attempt_started) * 1000),\n'
              '                    error=str(exc),\n'
              '                )\n'
              '                last_error = exc\n'
              '                if attempt == self._config.runtime.max_role_attempts:\n'
              '                    break\n',
          )

          test_quality = Path('tests/test_proposal_quality.py')
          text = test_quality.read_text(encoding='utf-8')
          text = text.replace(
              '    ProposalWorkflow,\n)',
              '    ProposalWorkflow,\n    _without_gate_only_decisions,\n)',
          )
          text += '''\n\ndef test_proposal_context_includes_flutter_platform_constraints_for_pm_and_ba() -> None:\n    pm_documents = select_context_documents(\n        root(), "product_manager", ["proposal_generation", "discovery"]\n    )\n    ba_documents = select_context_documents(\n        root(),\n        "business_analysis",\n        ["proposal_generation", "acceptance_criteria", "requirements"],\n    )\n\n    for documents in (pm_documents, ba_documents):\n        by_path = {document["path"]: document for document in documents}\n        constraints = by_path["docs/architecture/constraints.md"]\n        assert "Flutter mobile application" in str(constraints["content"])\n\n\ndef test_standard_product_approval_is_not_a_domain_decision() -> None:\n    normalized = _without_gate_only_decisions(\n        {\n            "decisions_required": [\n                "Human approval of product scope and priority for this proposal.",\n                "Approve or override the proposed P1 priority before implementation.",\n                "Choose the canonical lesson-content contract.",\n            ]\n        }\n    )\n\n    assert normalized["decisions_required"] == ["Choose the canonical lesson-content contract."]\n'''
          test_quality.write_text(text, encoding='utf-8')

          test_codex = Path('tests/test_codex.py')
          text = test_codex.read_text(encoding='utf-8')
          text = text.replace('import json\n', 'import json\nimport subprocess\n\nimport pytest\n')
          text = text.replace(
              'from scripts.orchestrator.codex import _codex_failure_detail, codex_output_schema\n',
              'from scripts.orchestrator.codex import (\n'
              '    CodexCliRunner,\n'
              '    CodexInvocationError,\n'
              '    _codex_failure_detail,\n'
              '    codex_output_schema,\n'
              ')\n',
          )
          text = text.replace(
              'from scripts.orchestrator.model import JsonObject\n',
              'from scripts.orchestrator.model import JsonObject, ModelSelection\n',
          )
          text += '''\n\ndef test_nonzero_codex_exit_preserves_completed_turn_usage(monkeypatch: pytest.MonkeyPatch, tmp_path: Path) -> None:\n    schema_path = tmp_path / "schema.json"\n    schema_path.write_text(\n        json.dumps(\n            {\n                "type": "object",\n                "properties": {"ok": {"type": "boolean"}},\n                "required": ["ok"],\n                "additionalProperties": False,\n            }\n        ),\n        encoding="utf-8",\n    )\n    stdout = (\n        '{"type":"thread.started","thread_id":"thread-1"}\\n'\n        '{"type":"turn.completed","usage":{"input_tokens":12,"output_tokens":3}}\\n'\n        '{"type":"error","message":"provider rejected result"}\\n'\n    )\n\n    def fake_run(*args: object, **kwargs: object) -> subprocess.CompletedProcess[str]:\n        return subprocess.CompletedProcess([], 1, stdout=stdout, stderr="")\n\n    monkeypatch.setattr(subprocess, "run", fake_run)\n    runner = CodexCliRunner(root=tmp_path, environment={})\n    model = ModelSelection("balanced", "openai", "gpt-test", "medium")\n\n    with pytest.raises(CodexInvocationError) as captured:\n        runner.run(\n            prompt="test",\n            schema_path=schema_path,\n            model=model,\n            timeout_seconds=30,\n        )\n\n    assert captured.value.usage is not None\n    assert captured.value.usage.input_tokens == 12\n    assert captured.value.usage.output_tokens == 3\n    assert captured.value.thread_id == "thread-1"\n'''
          test_codex.write_text(text, encoding='utf-8')

          Path('tests/test_state_telemetry.py').write_text('''"""Tests for durable telemetry from failed agent attempts."""\n\nfrom __future__ import annotations\n\nimport sqlite3\nfrom pathlib import Path\n\nfrom scripts.orchestrator.model import ModelSelection, Usage\nfrom scripts.orchestrator.state import StateStore\n\n\ndef test_failed_role_attempt_is_persisted_and_counted(tmp_path: Path) -> None:\n    store = StateStore(tmp_path)\n    workflow_id = "wf-test"\n    store.create_workflow(workflow_id, "FP-1234")\n    model = ModelSelection("balanced", "openai", "gpt-test", "medium")\n    usage = Usage(input_tokens=100, output_tokens=20, total_tokens=120)\n\n    store.record_role_failure(\n        workflow_id=workflow_id,\n        role="product_manager:revision-1",\n        attempt=1,\n        model=model,\n        usage=usage,\n        elapsed_ms=2500,\n        error="schema validation failed",\n    )\n\n    state = store.get(workflow_id)\n    assert state is not None\n    assert state.input_tokens == 100\n    assert state.output_tokens == 20\n    assert state.total_tokens == 120\n    assert state.elapsed_ms == 2500\n\n    with sqlite3.connect(tmp_path / "orchestrator.sqlite3") as connection:\n        row = connection.execute(\n            "SELECT status, error, input_tokens, output_tokens FROM role_runs "\n            "WHERE workflow_id = ? AND role = ? AND attempt = 1",\n            (workflow_id, "product_manager:revision-1"),\n        ).fetchone()\n    assert row == ("failed", "schema validation failed", 100, 20)\n\n\ndef test_existing_role_runs_table_is_migrated(tmp_path: Path) -> None:\n    database = tmp_path / "orchestrator.sqlite3"\n    with sqlite3.connect(database) as connection:\n        connection.execute(\n            """\n            CREATE TABLE role_runs (\n                workflow_id TEXT NOT NULL,\n                role TEXT NOT NULL,\n                attempt INTEGER NOT NULL,\n                profile TEXT NOT NULL,\n                model TEXT NOT NULL,\n                reasoning_effort TEXT NOT NULL,\n                input_tokens INTEGER NOT NULL,\n                output_tokens INTEGER NOT NULL,\n                total_tokens INTEGER NOT NULL,\n                elapsed_ms INTEGER NOT NULL,\n                output_json TEXT NOT NULL,\n                PRIMARY KEY (workflow_id, role, attempt)\n            )\n            """\n        )\n\n    StateStore(tmp_path)\n\n    with sqlite3.connect(database) as connection:\n        columns = {row[1] for row in connection.execute("PRAGMA table_info(role_runs)")}\n    assert {"status", "error"} <= columns\n''', encoding='utf-8')
