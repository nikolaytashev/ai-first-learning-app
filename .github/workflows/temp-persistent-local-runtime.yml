name: Temporary persistent local runtime patch

on:
  push:
    branches:
      - fix/user-project-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/user-project-auth
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python .github/temp_patch_persistent_local_runtime.py
          chmod +x orch
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate
        run: |
          ruff format scripts/orchestrator/github_auth.py tests/test_github_auth.py tests/test_local_launcher.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          python scripts/validate_repository.py
      - name: Commit production changes
        run: |
          rm .github/temp_patch_persistent_local_runtime.py
          rm .github/workflows/temp-persistent-local-runtime.yml
          git config user.name "Nikolay Tashev"
          git config user.email "43911488+nikolaytashev@users.noreply.github.com"
          git add -A
          git update-index --chmod=+x orch
          git commit -m "Add persistent one-command local orchestrator runtime"
          git push origin HEAD:fix/user-project-auth
