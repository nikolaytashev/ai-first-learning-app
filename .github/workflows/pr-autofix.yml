name: PR autofix

on:
  push:
    branches:
      - feature/github-control-plane-reconciliation

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/github-control-plane-reconciliation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Apply semantic fixes and Ruff formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected patch context not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "scripts/orchestrator/control_plane.py",
              '''                if isinstance(artifact_type, str) and isinstance(origin, str):
                    if artifact_type in {"Epic", "Feature", "Task"}:
                        result.append(ManagedIssue(issue, artifact_type, origin, metadata))
''',
              '''                if (
                    isinstance(artifact_type, str)
                    and isinstance(origin, str)
                    and artifact_type in {"Epic", "Feature", "Task"}
                ):
                    result.append(ManagedIssue(issue, artifact_type, origin, metadata))
''',
          )
          replace(
              "scripts/orchestrator/implementation.py",
              "from __future__ import annotations\n\nimport json\n",
              "from __future__ import annotations\n\nfrom collections.abc import Mapping\n\nimport json\n",
          )
          replace(
              "scripts/run_orchestrator.py",
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom typing import cast\n",
          )
          replace(
              "scripts/run_orchestrator.py",
              '''    state: RuntimeStateStore | None = None
    notifier: Notifier | None = None
    iteration_id: int | None = None
''',
              '''    state: RuntimeStateStore | None = None
    iteration_id: int | None = None
''',
          )
          replace(
              "scripts/run_orchestrator.py",
              '''        state = runtime_state
        notifier = Notifier(settings.notifications)
        waiting = workflow_state.latest_waiting()
''',
              '''        state = runtime_state
        waiting = workflow_state.latest_waiting()
''',
          )
          PY
          ruff check . --fix || true
          ruff format .
          ruff check . || true

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix PR lint issues"
          git push origin HEAD:feature/github-control-plane-reconciliation
