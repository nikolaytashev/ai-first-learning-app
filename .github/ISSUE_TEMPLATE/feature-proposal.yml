name: New feature
description: Give the orchestrator a new product feature to analyze, decompose and implement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue becomes the canonical Feature. Product Manager and Business Analysis agents will analyze it, maintain its specification and create/reconcile child Tasks. Continue product discussion in this issue's comments and use `/orch` commands to control it.

  - type: textarea
    id: request
    attributes:
      label: What do you want?
      description: Describe the desired feature in your own words. You do not need to write acceptance criteria or technical tasks.
      placeholder: I want the learner to be able to...
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why / problem being solved
      description: Optional context about the user problem or expected outcome.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints or important details
      description: Optional behaviours, exclusions, technical/business constraints, or decisions already made.

  - type: dropdown
    id: priority
    attributes:
      label: Priority override
      description: Optional. Leave Unspecified and let Product Management recommend priority.
      options:
        - Unspecified
        - P0
        - P1
        - P2
        - P3

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional related issues, screenshots, documents or links.
