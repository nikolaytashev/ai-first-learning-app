name: Temporary model routing patch

on:
  push:
    branches:
      - autonomy/runtime-completion
    paths:
      - scripts/_temp_model_routing_patch.py
      - scripts/_temp_model_routing_patch_fix.py
      - scripts/_temp_model_routing_test_fix.py
      - .github/workflows/_temp-model-routing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: autonomy/runtime-completion
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - name: Apply patch
        run: |
          python scripts/_temp_model_routing_patch_fix.py
          python scripts/_temp_model_routing_test_fix.py
          python scripts/_temp_model_routing_patch.py
      - name: Format
        run: ruff format scripts tests
      - name: Remove temporary files
        run: rm scripts/_temp_model_routing_patch.py scripts/_temp_model_routing_patch_fix.py scripts/_temp_model_routing_test_fix.py .github/workflows/_temp-model-routing.yml
      - name: Validate
        run: |
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Enforce full task model routing"
          git push origin HEAD:autonomy/runtime-completion
