name: Repair proposal quality fix

on:
  push:
    branches:
      - fix/proposal-context-and-ba-quality

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/proposal-context-and-ba-quality
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reapply production patch and repair formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-proposal-quality-fix.yml').read_text())
          script = workflow['jobs']['apply']['steps'][2]['run']
          Path('/tmp/apply-production.sh').write_text(script)
          subprocess.run(['bash', '/tmp/apply-production.sh'], check=True)

          path = Path('scripts/orchestrator/proposal.py')
          text = path.read_text()
          text = text.replace(
              '- XS/S: one coherent independently releasable user outcome; S must not bundle multiple product flows.\n',
              '- XS/S: one coherent independently releasable user outcome; S must not bundle multiple\n'
              '  product flows.\n',
              1,
          )
          path.write_text(text)
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Format and validate
        run: |
          ruff check --fix scripts/orchestrator/context.py scripts/orchestrator/backlog.py scripts/orchestrator/proposal.py tests/test_proposal_quality.py
          ruff format scripts/orchestrator/context.py scripts/orchestrator/backlog.py scripts/orchestrator/proposal.py tests/test_proposal_quality.py
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
      - name: Commit production changes only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/orchestrator/context.py scripts/orchestrator/backlog.py scripts/orchestrator/proposal.py tests/test_proposal_quality.py
          git commit -m 'Improve autonomous proposal quality and context efficiency'
          git push origin HEAD:fix/proposal-context-and-ba-quality
