name: PR autofix

on:
  push:
    branches:
      - feature/github-control-plane-reconciliation

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/github-control-plane-reconciliation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Apply semantic fixes and formatting
        run: |
          python scripts/pr_autofix_temp.py
          ruff check . --fix || true
          ruff format .
          ruff check . --exclude scripts/pr_autofix_temp.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix PR lint issues"
          git push origin HEAD:feature/github-control-plane-reconciliation
