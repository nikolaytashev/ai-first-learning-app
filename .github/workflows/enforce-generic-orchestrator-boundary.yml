name: Enforce generic orchestrator boundary

on:
  push:
    branches:
      - fix/proposal-platform-context-and-attempt-telemetry

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/proposal-platform-context-and-attempt-telemetry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Remove project-specific orchestrator logic and document boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          proposal = Path('scripts/orchestrator/proposal.py')
          text = proposal.read_text(encoding='utf-8')
          replacements = [
              (
                  'You are the Product Manager for the AI First Learning App.\n',
                  'You are the Product Manager for the current repository project.\n',
              ),
              (
                  'You are the independent Business Analysis agent for the AI First Learning App.\n',
                  'You are the independent Business Analysis agent for the current repository project.\n',
              ),
              (
                  'proposal should normally represent one coherent user flow and must not hide separate onboarding,\n'
                  'navigation, reader, persistence, privacy, or measurement capabilities inside one feature.\n',
                  'proposal should normally represent one coherent user outcome and must not bundle independently\n'
                  'releasable sub-capabilities inside one feature.\n',
              ),
              (
                  'Acceptance criteria must use the canonical client/platform from architecture context. Do not invent\n'
                  'browser, CSS, DOM, or web-test requirements when the scoped client is the Flutter mobile app.\n',
                  'Acceptance criteria must follow canonical product and architecture constraints from project\n'
                  'context. Never invent a client, platform, framework, protocol, storage model, or verification\n'
                  'technology that conflicts with those constraints.\n',
              ),
              (
                  'Reject acceptance criteria whose verification technology contradicts canonical architecture\n'
                  'constraints (for example browser/CSS/DOM checks for a Flutter-only mobile flow). The standard\n',
                  'Reject acceptance criteria whose implementation or verification assumptions contradict canonical\n'
                  'project or architecture constraints. Do not assume a technology stack that is not present in\n'
                  'authoritative context. The standard\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'proposal.py: expected exactly one match, found {count}: {old[:60]!r}')
              text = text.replace(old, new, 1)
          proposal.write_text(text, encoding='utf-8')

          tests = Path('tests/test_proposal_quality.py')
          text = tests.read_text(encoding='utf-8')
          old = '''def test_proposal_context_includes_flutter_platform_constraints_for_pm_and_ba() -> None:\n    pm_documents = select_context_documents(\n        root(), "product_manager", ["proposal_generation", "discovery"]\n    )\n    ba_documents = select_context_documents(\n        root(),\n        "business_analysis",\n        ["proposal_generation", "acceptance_criteria", "requirements"],\n    )\n\n    for documents in (pm_documents, ba_documents):\n        by_path = {document["path"]: document for document in documents}\n        constraints = by_path["docs/architecture/constraints.md"]\n        assert "Flutter mobile application" in str(constraints["content"])\n'''
          new = '''def test_proposal_context_includes_canonical_architecture_constraints_for_pm_and_ba() -> None:\n    pm_documents = select_context_documents(\n        root(), "product_manager", ["proposal_generation", "discovery"]\n    )\n    ba_documents = select_context_documents(\n        root(),\n        "business_analysis",\n        ["proposal_generation", "acceptance_criteria", "requirements"],\n    )\n\n    for documents in (pm_documents, ba_documents):\n        by_path = {document["path"]: document for document in documents}\n        constraints = by_path["docs/architecture/constraints.md"]\n        assert constraints["authority"] == "human_approved"\n        assert str(constraints["content"]).strip()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'test_proposal_quality.py: expected one platform test, found {text.count(old)}')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('docs/autonomy/workflow.md')
          text = workflow.read_text(encoding='utf-8')
          anchor = '''state or execute privileged GitHub/Git actions.\n\n'''
          section = '''state or execute privileged GitHub/Git actions.\n\n## Generic orchestrator boundary\n\nThe orchestrator core is a reusable project-automation engine, not part of the product that it\norchestrates. This is a non-negotiable architecture constraint. The same core must be usable by a\ndifferent repository, product domain, technology stack, or delivery target without changing core\ncode. Project onboarding may supply different configuration and context, but must not require a fork\nor project-specific condition in the orchestrator.\n\nThe core MUST NOT hardcode:\n\n- product or company names, business-domain terminology, user journeys, or feature semantics;\n- client types, platforms, frameworks, languages, databases, protocols, cloud providers, or testing\n  technologies as assumptions about the project being built;\n- project-specific paths, commands, validation rules, architecture decisions, or acceptance\n  criteria, except for generic configuration contracts that tell the core where such data lives;\n- special-case branches such as `if this project uses X` or literal checks for a project's chosen\n  technology.\n\nProject-specific knowledge belongs outside the core and is supplied as data through repository-owned\nconfiguration and authoritative context, including the context index, mission/product/architecture\ndocuments, validation configuration, repository policy, and configured extensions or capabilities.\nThe orchestrator may understand generic concepts such as roles, capabilities, work hierarchy,\ndependencies, approvals, budgets, retries, authority levels, validation commands, provider adapters,\nand context selection. It must apply project constraints generically rather than encoding their\ncontents.\n\nFor example, when an acceptance criterion conflicts with a canonical architecture constraint, the\nBusiness Analysis flow should reject the conflict because authoritative context says so. The core\nmust not know or test which concrete framework, client, storage engine, or verification technology\nthat constraint names. Core regression tests should therefore use technology-neutral or synthetic\nfixtures wherever they exercise orchestration behavior.\n\nSpecialized roles or capabilities that are not universally applicable must be registered through\nconfiguration or extension boundaries rather than embedded as project-domain logic in the generic\nengine. Future extraction of the orchestrator into a standalone autonomous-project platform must be\npossible without removing knowledge of the project that originally hosted it.\n\nEvery orchestrator change must pass this portability question during review: **could the unchanged\ncore run this behavior for an unrelated project whose domain and stack are completely different,\nwith only project configuration/context replaced?** If not, the behavior belongs outside the core.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'workflow.md: expected one purpose anchor, found {text.count(anchor)}')
          workflow.write_text(text.replace(anchor, section, 1), encoding='utf-8')

          context_index = Path('docs/project-context/context-index.yaml')
          text = context_index.read_text(encoding='utf-8')
          text = text.replace('last_updated: "2026-07-24"', 'last_updated: "2026-09-12"', 1)
          old = '''  - path: docs/autonomy/workflow.md\n    title: Autonomous workflow\n    authority: repository_policy\n    version: "1.0"\n    last_reviewed: "2026-07-23"\n'''
          new = '''  - path: docs/autonomy/workflow.md\n    title: Autonomous workflow\n    authority: repository_policy\n    version: "1.1"\n    last_reviewed: "2026-09-12"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'context-index.yaml: expected workflow metadata block, found {text.count(old)}')
          context_index.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Fail the patch if the core still contains the project/mobile literals introduced here.
          core = Path('scripts/orchestrator/proposal.py').read_text(encoding='utf-8')
          for forbidden in ('AI First Learning App', 'Flutter mobile app', 'browser/CSS/DOM'):
              if forbidden in core:
                  raise SystemExit(f'project-specific orchestrator literal remains: {forbidden}')
          PY
          ruff format .
          ruff check . --fix
          ruff format .
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline
      - name: Commit intended changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/orchestrator/proposal.py tests/test_proposal_quality.py docs/autonomy/workflow.md docs/project-context/context-index.yaml
          git commit -m 'Keep orchestrator core project-agnostic'
          git push origin HEAD:fix/proposal-platform-context-and-attempt-telemetry
