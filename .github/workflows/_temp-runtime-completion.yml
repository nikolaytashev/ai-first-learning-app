name: Temporary runtime completion patch

on:
  push:
    branches:
      - autonomy/runtime-completion
    paths:
      - scripts/_temp_runtime_completion_patch.py
      - .github/workflows/_temp-runtime-completion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: autonomy/runtime-completion
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Apply production patch
        run: python scripts/_temp_runtime_completion_patch.py
      - name: Compile generated Python
        run: |
          python -m py_compile scripts/orchestrator/implementation.py scripts/orchestrator/backlog.py scripts/run_orchestrator.py || {
            nl -ba scripts/orchestrator/implementation.py | sed -n '595,620p'
            exit 1
          }
      - name: Format production files
        run: ruff format scripts tests
      - name: Remove temporary patch machinery
        run: rm scripts/_temp_runtime_completion_patch.py .github/workflows/_temp-runtime-completion.yml
      - name: Validate
        run: |
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete autonomous runtime lifecycle"
          git push origin HEAD:autonomy/runtime-completion
