name: Reapply proposal platform and telemetry fix

on:
  push:
    branches:
      - fix/proposal-platform-context-and-attempt-telemetry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/proposal-platform-context-and-attempt-telemetry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Reapply patch from source workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-proposal-platform-telemetry-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/apply_fix.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_fix.py
          ruff format .
          ruff check . --fix
          ruff format .
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project-context/context-index.yaml scripts/orchestrator/codex.py scripts/orchestrator/state.py scripts/orchestrator/proposal.py tests/test_proposal_quality.py tests/test_codex.py tests/test_state_telemetry.py
          git commit -m 'Harden proposal platform context and attempt telemetry'
          git push origin HEAD:fix/proposal-platform-context-and-attempt-telemetry
