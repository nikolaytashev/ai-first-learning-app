name: Temporary format global launcher tests

on:
  push:
    branches:
      - feature/optional-launchd-runtime

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/optional-launchd-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install ruff==0.15.22
      - name: Format and clean temporary workflow
        run: |
          ruff format tests/test_local_launcher.py
          rm .github/workflows/temp-format-global-launcher.yml
      - name: Commit formatted test
        run: |
          git config user.name "Nikolay Tashev"
          git config user.email "43911488+nikolaytashev@users.noreply.github.com"
          git add -A
          git commit -m "Format global launcher tests"
          git push origin HEAD:feature/optional-launchd-runtime
