name: Temporary user Project auth patch

on:
  push:
    branches:
      - fix/user-project-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/user-project-auth
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_temp_patch_user_project_auth.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate
        run: |
          ruff format scripts/orchestrator/github.py scripts/orchestrator/github_auth.py scripts/run_orchestrator.py tests/test_project_bootstrap.py tests/test_project_auth.py
          ruff check scripts/orchestrator/github.py scripts/orchestrator/github_auth.py scripts/run_orchestrator.py tests/test_project_bootstrap.py tests/test_project_auth.py
          mypy scripts tests
          pytest
          python scripts/validate_repository.py
      - name: Commit production changes
        run: |
          rm scripts/_temp_patch_user_project_auth.py
          rm .github/workflows/temp-user-project-auth.yml
          git config user.name "Nikolay Tashev"
          git config user.email "43911488+nikolaytashev@users.noreply.github.com"
          git add -A
          git commit -m "Use dedicated token for user-owned GitHub Project"
          git push origin HEAD:fix/user-project-auth
