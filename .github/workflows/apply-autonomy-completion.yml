name: Apply autonomy completion patch

on:
  push:
    branches:
      - feature/autonomy-completion-p0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'feature/autonomy-completion-p0' || github.head_ref == 'feature/autonomy-completion-p0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/autonomy-completion-p0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Apply production patch
        run: python scripts/_apply_autonomy_completion.py

      - name: Remove temporary helpers
        run: |
          rm scripts/_apply_autonomy_completion.py
          rm .github/workflows/apply-autonomy-completion.yml

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Format Python
        run: ruff format scripts tests

      - name: Validate production patch
        run: |
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Complete autonomous product workflow'
          git push origin HEAD:feature/autonomy-completion-p0
