name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - name: Print Ruff formatting diff
        run: |
          ruff format .
          git diff --no-color -- scripts/orchestrator/notifications.py scripts/orchestrator/repository_health.py scripts/run_orchestrator.py tests/test_runtime_policy.py
          exit 1
