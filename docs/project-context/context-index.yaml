schema_version: 1
last_updated: "2026-07-23"

authority_levels:
  repository_policy: Binding operating rule; changes require human review.
  human_approved: Product or architecture context explicitly accepted by the human owner.
  working_draft: Useful context that may evolve without changing an approved decision.
  decision_required: Unresolved input that agents must return to the human owner.

loading_rules:
  - Load AGENTS.md for every agent run.
  - Load only entries whose consumers or task_types match the current assignment.
  - Treat decision_required sections as questions, never as permission to invent behaviour.
  - Prefer the highest-authority entry when context conflicts.
  - Return unresolved conflicts to the Business Analyst or human owner.

