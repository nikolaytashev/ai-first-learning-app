name: Temporary project bootstrap patch

on:
  push:
    branches:
      - feature/project-schema-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/project-schema-bootstrap
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/temp_project_bootstrap_patch.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate
        run: |
          ruff format scripts/orchestrator/github.py scripts/run_orchestrator.py tests/test_project_bootstrap.py
          ruff check scripts/orchestrator/github.py scripts/run_orchestrator.py tests/test_project_bootstrap.py
          mypy scripts tests
          pytest
          python scripts/validate_repository.py
      - name: Commit production changes
        run: |
          rm .github/workflows/temp-project-bootstrap.yml
          rm tools/temp_project_bootstrap_patch.py
          git config user.name "Nikolay Tashev"
          git config user.email "43911488+nikolaytashev@users.noreply.github.com"
          git add -A
          git commit -m "Add idempotent Project schema bootstrap"
          git push origin HEAD:feature/project-schema-bootstrap
