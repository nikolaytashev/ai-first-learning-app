name: PR GitHub App patch

on:
  push:
    branches:
      - fix/github-app-runtime-auth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/github-app-runtime-auth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Apply patch and formatting
        run: |
          head -n -1 scripts/pr_github_app_patch_temp.py > /tmp/pr_github_app_patch.py
          printf '\nif __name__ == "__main__":\n    main()\n' >> /tmp/pr_github_app_patch.py
          python /tmp/pr_github_app_patch.py
          sed -i 's/;;;;/;;/g' scripts/orchestrator/implementation.py
          rm scripts/pr_github_app_patch_temp.py
          rm .github/workflows/pr-github-app-patch.yml
          ruff check . --fix
          ruff format .

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Use renewable GitHub App credentials"
          git push origin HEAD:fix/github-app-runtime-auth
