name: Finish proposal hardening fix

on:
  push:
    branches:
      - fix/proposal-platform-context-and-attempt-telemetry

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/proposal-platform-context-and-attempt-telemetry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Apply and validate production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-proposal-platform-telemetry-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('/tmp/apply_fix.py').write_text(textwrap.dedent(source[start:end]), encoding='utf-8')
          PY
          python /tmp/apply_fix.py
          python - <<'PY'
          from pathlib import Path

          codex = Path('scripts/orchestrator/codex.py')
          text = codex.read_text(encoding='utf-8')

          nonzero_old = (
              '            usage, thread_id = _jsonl_telemetry(completed.stdout)\n'
              '            raise CodexInvocationError(\n'
              '                f"Codex CLI failed with exit code {completed.returncode}{suffix}",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            )\n'
          )
          nonzero_new = (
              '            failure_usage, failure_thread_id = _jsonl_telemetry(completed.stdout)\n'
              '            raise CodexInvocationError(\n'
              '                f"Codex CLI failed with exit code {completed.returncode}{suffix}",\n'
              '                usage=failure_usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=failure_thread_id,\n'
              '            )\n'
          )
          if text.count(nonzero_old) != 1:
              raise SystemExit(f'expected one nonzero telemetry block, found {text.count(nonzero_old)}')
          text = text.replace(nonzero_old, nonzero_new, 1)

          timeout_old = (
              '            usage, thread_id = _jsonl_telemetry(stdout)\n'
              '            raise CodexInvocationError(\n'
              '                "Codex role run exceeded its elapsed-time budget",\n'
              '                usage=usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=thread_id,\n'
              '            ) from exc\n'
          )
          timeout_new = (
              '            timeout_usage, timeout_thread_id = _jsonl_telemetry(stdout)\n'
              '            raise CodexInvocationError(\n'
              '                "Codex role run exceeded its elapsed-time budget",\n'
              '                usage=timeout_usage,\n'
              '                elapsed_ms=elapsed_ms,\n'
              '                thread_id=timeout_thread_id,\n'
              '            ) from exc\n'
          )
          if text.count(timeout_old) != 1:
              raise SystemExit(f'expected one timeout telemetry block, found {text.count(timeout_old)}')
          codex.write_text(text.replace(timeout_old, timeout_new, 1), encoding='utf-8')

          proposal = Path('scripts/orchestrator/proposal.py')
          text = proposal.read_text(encoding='utf-8')
          old = (
              '    if isinstance(decisions, list):\n'
              '        normalized["decisions_required"] = [\n'
              '            str(item) for item in decisions if not _is_gate_only_decision(str(item))\n'
              '        ]\n'
              '    return normalized\n'
          )
          new = (
              '    if isinstance(decisions, list):\n'
              '        normalized_decisions = [\n'
              '            str(item) for item in decisions if not _is_gate_only_decision(str(item))\n'
              '        ]\n'
              '        normalized["decisions_required"] = normalized_decisions\n'
              '        if not normalized_decisions and normalized.get("status") == "needs_decision":\n'
              '            normalized["status"] = "proposed"\n'
              '    return normalized\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one gate-decision normalization block, found {text.count(old)}')
          proposal.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_proposal_quality.py')
          text = tests.read_text(encoding='utf-8')
          fixture_old = '        {\n            "decisions_required": [\n'
          fixture_new = '        {\n            "status": "needs_decision",\n            "decisions_required": [\n'
          if text.count(fixture_old) < 1:
              raise SystemExit('proposal quality test fixture not found')
          text = text.replace(fixture_old, fixture_new, 1)
          assertion = '    assert normalized["decisions_required"] == ["Choose the canonical lesson-content contract."]\n'
          replacement = (
              assertion
              + '    assert normalized["status"] == "needs_decision"\n\n\n'
              + 'def test_gate_only_decisions_downgrade_needs_decision_to_proposed() -> None:\n'
              + '    normalized = _without_gate_only_decisions(\n'
              + '        {\n'
              + '            "status": "needs_decision",\n'
              + '            "decisions_required": [\n'
              + '                "Human approval of product scope and priority for this proposal."\n'
              + '            ],\n'
              + '        }\n'
              + '    )\n\n'
              + '    assert normalized["decisions_required"] == []\n'
              + '    assert normalized["status"] == "proposed"\n'
          )
          if text.count(assertion) != 1:
              raise SystemExit(f'expected one decision assertion, found {text.count(assertion)}')
          tests.write_text(text.replace(assertion, replacement, 1), encoding='utf-8')
          PY
          ruff format .
          ruff check . --fix
          ruff format .
          python scripts/validate_repository.py
          ruff check .
          ruff format --check .
          mypy scripts tests
          pytest
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project-context/context-index.yaml scripts/orchestrator/codex.py scripts/orchestrator/state.py scripts/orchestrator/proposal.py tests/test_proposal_quality.py tests/test_codex.py tests/test_state_telemetry.py
          git commit -m 'Harden proposal platform context and attempt telemetry'
          git push origin HEAD:fix/proposal-platform-context-and-attempt-telemetry
